<!doctype html>
<!--
Molde das imagens de compartilhamento (1200x630). Nao e publicado: quem gera
os PNGs e gerar_og.py, que troca {{etiqueta}}, {{manchete}}, {{sub}} e
{{selos}} e fotografa com o Chromium.

Numero em imagem nao se atualiza: use so o que vale para a serie inteira,
com fonte escrita no insight correspondente.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  /* A mesma fonte do site (Instrument Sans, SIL OFL). O caminho absoluto
     entra no lugar de {{fontes}} porque o HTML temporario mora em work/ e
     o Chromium le o arquivo do disco. Sem ela, a previa do WhatsApp e do
     LinkedIn sairia com outra letra que a do site. */
  @font-face {
    font-family: "Instrument Sans";
    font-weight: 400 700;
    src: url("{{fontes}}/instrument-sans-latin.woff2") format("woff2");
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Instrument Sans", "DejaVu Sans", "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7f9 0 58%, #e3f3e8 58% 100%);
    color: #1d2530; padding: 60px 72px; position: relative;
  }
  .marca { display: flex; align-items: baseline; gap: 14px; }
  .marca b { font-size: 42px; font-weight: 600; letter-spacing: -1.2px; }
  .marca span { font-size: 25px; color: #5a6570; }
  .etiqueta { display: inline-block; margin-top: 44px; font-size: 22px; font-weight: bold;
              color: #1a56b8; letter-spacing: 0.5px; text-transform: uppercase; }
  h1 { font-size: 62px; font-weight: 600; line-height: 1.08; margin-top: 14px;
       letter-spacing: -1.6px; max-width: 1060px; }
  h1 em { font-style: normal; color: #17663a; }
  p { font-size: 28px; line-height: 1.35; color: #5a6570; margin-top: 18px; max-width: 980px; }
  .selos { position: absolute; left: 72px; bottom: 56px; display: flex; gap: 16px; }
  .selos span { font-size: 23px; font-weight: bold; padding: 10px 20px; border-radius: 999px; border: 2px solid; }
  .v { color: #17663a; border-color: #17663a; background: #e7f5ec; }
  .a { color: #7a5200; border-color: #7a5200; background: #fdf1de; }
  .r { color: #5b2d91; border-color: #5b2d91; background: #f1e9fb; }
  .z { color: #1a56b8; border-color: #1a56b8; background: #e8f0fc; }
</style>
</head>
<body>
  <div class="marca"><b>🔓 Liberados</b><span>· domínios .br que voltaram ao mercado</span></div>
  <div class="etiqueta">{{etiqueta}}</div>
  <h1>{{manchete}}</h1>
  <p>{{sub}}</p>
  <div class="selos">{{selos}}</div>
</body>
</html>
